appId: com.abiplayer.beta
productName: Abi Player
publish:
  provider: github
  owner: enesbsafak
  repo: AbiPlayer
directories:
  buildResources: build
# These are negation-only patterns, so electron-builder falls back to `**/*`:
# anything left in the project root ends up inside app.asar. .gitignore is NOT
# consulted here, so every non-runtime root entry has to be listed explicitly.
#
# Keep every exclusion in THIS list. Adding a `files:` block under `win:` makes
# electron-builder build a second negation-only matcher that falls back to
# `**/*` on its own, which silently defeats everything listed here — a build
# that way packed dist/, docs/ and src/ into app.asar and grew it to 3.3GB.
files:
  - '!**/.vscode/*'
  - '!src/*'
  # mpv and ffmpeg are shipped as extraResources (see win: below), not in app.asar.
  - '!resources/**'
  - '!docs/**'
  - '!{.agents,.claude,.react-doctor}/**'
  - '!electron.vite.config.*'
  - '!{postcss.config.js,tailwind.config.ts,vitest.config.ts,doctor.config.*}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,LICENSE}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.scripts.json,eslint.config.mjs}'
  # Repository-only trees. `.worktrees/` holds full parallel checkouts; without
  # this line every one of them was packed into app.asar. Checked by
  # `npm run test:e2e:packaged` after `npm run build:unpack`.
  - '!{.worktrees,e2e,scripts,.github}/**'
  - '!{test-results,playwright-report,coverage}/**'
  - '!**/*.tsbuildinfo'
  # Source maps of dependencies (electron-updater's chain); nothing reads them.
  - '!**/*.map'
win:
  icon: build/icon.ico
  executableName: abi-player
  forceCodeSigning: false
  target:
    - nsis
  # Both directories are filled by `npm run prepare:binaries:win` from the
  # pins in scripts/mpv-pin.json and scripts/ffmpeg-pin.json. The main process
  # looks for them at <resources>/mpv and <resources>/ffmpeg.
  extraResources:
    - from: resources/mpv/win32-x64
      to: mpv
      filter:
        - '**/*'
    - from: resources/ffmpeg/win32-x64
      to: ffmpeg
      filter:
        - '**/*'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # `true` creates the shortcut on the first install only; `always` brought a
  # shortcut the user had deleted back on every update.
  createDesktopShortcut: true
  # build/installerSidebar.bmp and build/installerHeader.bmp (made by
  # `npm run make:icons`) are NOT wired here on purpose: `oneClick` is unset
  # (default true), and installerSidebar, uninstallerSidebar and
  # installerHeader are "assisted installer only" options that a one-click
  # installer ignores. If `oneClick: false` is ever set, add
  # installerSidebar / uninstallerSidebar: build/installerSidebar.bmp and
  # installerHeader: build/installerHeader.bmp.

appId: com.abiplayer.beta
productName: Abi Player
publish:
  provider: github
  owner: enesbsafak
  repo: AbiPlayer
directories:
  buildResources: build
# These are negation-only patterns, so electron-builder falls back to `**/*`:
# anything left in the project root ends up inside app.asar. .gitignore is NOT
# consulted here, so every non-runtime root entry has to be listed explicitly.
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!resources/mpv/**'
  - '!docs/**'
  - '!{.agents,.claude,.react-doctor}/**'
  - '!electron.vite.config.*'
  - '!{postcss.config.js,tailwind.config.ts,vitest.config.ts,doctor.config.*}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  executableName: abi-player
  forceCodeSigning: false
  target:
    - nsis
  extraResources:
    - from: resources/mpv/win32-x64
      to: mpv
      filter:
        - '**/*'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Required for file access.
  notarize: false
  target:
    - dmg
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: electronjs.org
  category: Video
appImage:
  artifactName: ${name}-${version}.${ext}

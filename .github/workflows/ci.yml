# F0-01: her push ve PR'da lint, tür denetimi, birim testleri ve derleme;
# ardından gerçek mpv ile uçtan uca testler ve paketlenmiş uygulama (ayrı
# işler, önce ilki geçmeli).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One Node for every job. package.json "engines" is the floor (e2e/ runs .ts
# files with Node's own type stripping); each job checks it before anything runs.
env:
  NODE_VERSION: '26'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # lint:changed, PR tabanıyla karşılaştırmak için geçmişe ihtiyaç duyar.
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Node satisfies package.json engines
        run: node -e "const want = require('./package.json').engines.node; if (!require('semver').satisfies(process.version, want)) { console.error(process.version + ' does not satisfy ' + want); process.exit(1) }"

      # src, scripts and e2e (package.json "lint").
      - name: Lint
        run: npm run lint

      - name: Lint changed files (zero warnings)
        if: github.event_name == 'pull_request'
        run: npm run lint:changed -- "origin/${{ github.base_ref }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx electron-vite build

  e2e:
    name: End-to-end (real mpv)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Node satisfies package.json engines
        run: node -e "const want = require('./package.json').engines.node; if (!require('semver').satisfies(process.version, want)) { console.error(process.version + ' does not satisfy ' + want); process.exit(1) }"

      # The pinned, hash-checked mpv and ffmpeg (scripts/*-pin.json).
      - name: Fetch pinned mpv and ffmpeg
        run: npm run prepare:binaries:win

      # Type-checks e2e/, builds, runs every scenario.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/.output/
          retention-days: 14
          # e2e/.output is a dot folder, which upload-artifact v4 skips unless told.
          include-hidden-files: true

  packaged:
    name: Packaged app (smoke and end-to-end)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Node satisfies package.json engines
        run: node -e "const want = require('./package.json').engines.node; if (!require('semver').satisfies(process.version, want)) { console.error(process.version + ' does not satisfy ' + want); process.exit(1) }"

      # Fetches both pinned binaries, type-checks, builds, packs dist/win-unpacked.
      - name: Unpacked package
        run: npm run build:unpack

      - name: Package contents
        run: npm run test:e2e:packaged

      - name: End-to-end against the package
        run: npm run test:e2e:packaged-app

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-e2e-report
          path: e2e/.output/packaged/
          retention-days: 14
          # e2e/.output is a dot folder, which upload-artifact v4 skips unless told.
          include-hidden-files: true
